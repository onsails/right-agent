[package]
name = "right-agent"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
miette = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
which = { workspace = true }
tempfile = { workspace = true }
right-config = { path = "../right-config", version = "*" }
right-openshell = { path = "../right-openshell", version = "*" }
right-ui = { path = "../right-ui", version = "*" }
right-agent-config = { path = "../right-agent-config", version = "*" }
right-stt = { path = "../right-stt", version = "*" }
right-db = { path = "../right-db", version = "*" }
right-memory = { path = "../right-memory", version = "*" }
right-mcp = { path = "../right-mcp", version = "*" }
right-codegen = { path = "../right-codegen", version = "*" }
right-platform-knobs = { path = "../right-platform-knobs", version = "*" }
right-runtime-state = { path = "../right-runtime-state", version = "*" }
reqwest = { workspace = true }
inquire = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
cron-descriptor = { workspace = true }
tonic = { workspace = true }
fs4 = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
const_format = { workspace = true }
uuid = { workspace = true }

[features]
test-support = ["right-openshell/test-support"]

[dev-dependencies]
right-openshell = { path = "../right-openshell", version = "*", features = ["test-support"] }
right-db = { path = "../right-db", version = "*", features = ["test-support"] }
rustls = { workspace = true }
tokio = { version = "1.52", features = ["test-util"] }
wiremock = "0.6"
