# Agent configuration for the "Right" agent
# See: https://github.com/onsails/right-agent

# Restart policy: on_failure, always, never
restart: on_failure

# Maximum restart attempts
max_restarts: 5

# Seconds to wait between restarts
backoff_seconds: 10

# Sandbox. Every agent runs inside a microsandbox VM; only the name is
# configurable and `right agent init` writes it below.
# sandbox:
#   name: right-<agent>

# Network policy: restrictive = Anthropic/Claude only, permissive = all HTTPS
# network_policy: restrictive

# Per-agent environment variables injected before exec claude.
# Values are single-quoted literals — no shell expansion, no host variable forwarding.
# WARNING: values are stored in plaintext in agent.yaml. Do not store secrets here.
# env:
#   MY_VAR: "literal value"
#   ANOTHER_VAR: "also literal"

# Show live thinking indicator in Telegram during CC execution
show_thinking: true

# Debug mode: when true, `claude -p` runs with --debug --debug-file=...
# Toggle live in Telegram via `/debug on` / `/debug off`. Persists here.
# debug: false

# Claude model. Switch via Telegram /model command, or set explicitly:
#   model: "claude-opus-4-7[1m]"     # Opus 4.7 with 1M context — most capable
#   model: "claude-sonnet-4-6"        # Sonnet 4.6 — everyday tasks
#   model: "claude-sonnet-4-6[1m]"    # Sonnet 4.6 with 1M context (extra usage)
#   model: "claude-haiku-4-5"         # Haiku 4.5 — fastest
# Omit this field only to inherit Claude Code's own default.

# Per-agent secret for Bearer token derivation.
# Auto-generated by Right Agent. Do not edit.
# secret: <auto-generated on first right up>
