[package]
name = "right"
# The workspace version is the single release line for Right Agent crates.
version.workspace = true
edition.workspace = true

[[bin]]
name = "right"
path = "src/main.rs"

[dependencies]
right-agent = { path = "../right-agent", version = "*" }
right-hostpath = { path = "../right-hostpath", version = "*" }
right-agent-config = { path = "../right-agent-config", version = "*" }
right-bot = { path = "../bot", version = "*" }
right-codegen = { path = "../right-codegen", version = "*" }
right-config = { path = "../right-config", version = "*" }
right-db = { path = "../right-db", version = "*" }
right-lifecycle = { path = "../right-lifecycle", version = "*" }
right-mcp = { path = "../right-mcp", version = "*" }
right-memory = { path = "../right-memory", version = "*" }
right-openshell = { path = "../right-openshell", version = "*" }
right-runtime-state = { path = "../right-runtime-state", version = "*" }
right-stt = { path = "../right-stt", version = "*" }
right-ui = { path = "../right-ui", version = "*" }
clap = { workspace = true }
dirs = { workspace = true }
miette = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
which = { workspace = true }
rmcp = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
schemars = { workspace = true }
axum = { workspace = true }
dashmap = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
http = "1.4"
subtle = { workspace = true }
inquire = { workspace = true }
chrono = { workspace = true }
walkdir = { workspace = true }
secrecy = { workspace = true }
tonic = { workspace = true }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
right-db = { path = "../right-db", version = "*", features = ["test-support"] }
right-openshell = { path = "../right-openshell", version = "*", features = ["test-support"] }
tempfile = "3.27"
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
