# buf module config for the vendored OpenShell protos.
#
# Used only by the `openshell-proto-compat` GitHub workflow's `buf breaking`
# check, which compares a freshly re-vendored upstream proto against the
# currently committed one. The Rust build uses tonic-prost-build, not buf —
# this file does not affect compilation.
#
# PACKAGE category (not WIRE): the 0.0.56 break that motivated this — moving
# `Sandbox.phase` (field 4) to `SandboxStatus.phase` (field 6) — is wire-SAFE
# (old readers silently get the default), so WIRE rules pass. PACKAGE's
# FIELD_NO_DELETE flags the field removal regardless, which is the signal we
# need.
version: v1
breaking:
  use:
    - PACKAGE
