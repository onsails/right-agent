[package]
name = "right-openshell"
version.workspace = true
edition.workspace = true
publish = false

[features]
test-support = []

[dependencies]
chrono = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }
nix = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
right-process = { path = "../right-process", version = "*" }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
shlex = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
which = { workspace = true }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }

[package.metadata.cargo-machete]
ignored = ["prost", "prost-types", "tonic-prost", "tonic-prost-build"]
# prost/prost-types/tonic-prost: used via fully-qualified paths inside code
# generated by tonic::include_proto! in src/lib.rs; cargo-machete cannot see
# macro-expanded usage.
# tonic-prost-build: used in build.rs (tonic_prost_build::configure()); cargo-machete
# does not analyse build scripts.
