right-agent-config = { path = "../right-agent-config", version = "*" }
right-codegen = { path = "../right-codegen", version = "*" }
right-config = { path = "../right-config", version = "*" }
right-openshell = { path = "../right-openshell", version = "*" }
right-process = { path = "../right-process", version = "*" }
right-db = { path = "../right-db", version = "*" }
right-mcp = { path = "../right-mcp", version = "*" }
right-memory = { path = "../right-memory", version = "*" }
right-prompt-safety = { path = "../right-prompt-safety", version = "*" }
right-platform-store = { path = "../right-platform-store", version = "*" }
right-platform-knobs = { path = "../right-platform-knobs", version = "*" }
right-runtime-state = { path = "../right-runtime-state", version = "*" }
right-stt = { path = "../right-stt", version = "*" }
right-ui = { path = "../right-ui", version = "*" }
teloxide = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
which = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
cron = { workspace = true }
arc-swap = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
shlex = { workspace = true }
tempfile = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
pulldown-cmark = { workspace = true }
signal-hook = { workspace = true }
url = { workspace = true }
rand = { workspace = true }
futures = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
whisper-rs = { version = "0.16", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }

[dev-dependencies]
right-agent = { path = "../right-agent", version = "*" }
right-openshell = { path = "../right-openshell", version = "*", features = ["test-support"] }
rustls = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = "0.5"
tracing-subscriber = { workspace = true }
