name: Tests

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Provide external-tool test stubs
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          mkdir -p "$HOME/.cloudflared"
          echo "cloudflared test cert" > "$HOME/.cloudflared/cert.pem"
          cat > "$RUNNER_TEMP/bin/cloudflared" <<'SH'
          #!/bin/sh
          set -eu

          uuid="00000000-0000-0000-0000-000000000000"
          cf_dir="$HOME/.cloudflared"
          mkdir -p "$cf_dir"

          case " $* " in
            *" tunnel "*" list "*)
              printf '[]\n'
              ;;
            *" tunnel "*" create "*)
              for last do :; done
              printf '{}\n' > "$cf_dir/$uuid.json"
              printf '{"id":"%s","name":"%s"}\n' "$uuid" "$last"
              ;;
            *)
              echo "cloudflared test stub" >&2
              ;;
          esac
          SH
          cat > "$RUNNER_TEMP/bin/claude" <<'SH'
          #!/bin/sh
          echo "claude test stub" >&2
          exit 0
          SH
          chmod +x "$RUNNER_TEMP/bin/cloudflared" "$RUNNER_TEMP/bin/claude"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Test workspace
        run: |
          devenv shell -- bash -lc "export PATH=\"\$RUNNER_TEMP/bin:\$PATH\"; cargo test --workspace --lib --bins --tests --no-fail-fast --locked"

  stt:
    name: stt ignored tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - uses: actions/cache@v5
        with:
          path: ~/.right/cache/whisper
          key: whisper-ggml-tiny-v1

      - name: Run STT ignored tests
        run: |
          devenv shell -- cargo test --workspace --no-fail-fast --locked ci_stt -- --ignored

  openshell:
    name: openshell ignored tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENSHELL_VERSION: "v0.0.42"
      RIGHT_MAX_CONCURRENT_SANDBOX_TESTS: "2"
      RIGHT_TEST_SANDBOX_READY_TIMEOUT_SECS: "360"
      RIGHT_TEST_SANDBOX_SSH_TIMEOUT_SECS: "120"
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Check Docker runtime
        run: |
          docker version
          docker info

      - name: Install OpenShell
        run: |
          secret="$(openssl rand -hex 32)"
          echo "OPENSHELL_SSH_HANDSHAKE_SECRET=$secret" >> "$GITHUB_ENV"
          systemctl --user set-environment OPENSHELL_SSH_HANDSHAKE_SECRET="$secret"
          curl -LsSf https://raw.githubusercontent.com/NVIDIA/OpenShell/main/install.sh | OPENSHELL_VERSION="$OPENSHELL_VERSION" OPENSHELL_SSH_HANDSHAKE_SECRET="$secret" sh
          openshell --version
          openshell --help

      - name: Wait for OpenShell gateway
        run: |
          for attempt in $(seq 1 90); do
            if openshell status >/dev/null 2>&1 \
              && test -f "$HOME/.config/openshell/gateways/openshell/mtls/ca.crt" \
              && test -f "$HOME/.config/openshell/gateways/openshell/mtls/tls.crt" \
              && test -f "$HOME/.config/openshell/gateways/openshell/mtls/tls.key"; then
              openshell status
              exit 0
            fi
            echo "waiting for OpenShell gateway ($attempt/90)"
            sleep 2
          done
          systemctl --user status openshell-gateway --no-pager || true
          journalctl --user -u openshell-gateway --no-pager -n 80 || true
          exit 1

      - name: OpenShell doctor
        run: openshell doctor check

      - name: Run OpenShell ignored tests
        run: |
          devenv shell -- bash -lc "export PATH=\"\$PATH:/usr/local/bin:/usr/bin\"; cargo test --workspace --no-fail-fast --locked ci_openshell -- --ignored"

      - name: Dump OpenShell diagnostics
        if: failure()
        run: |
          openshell status || true
          journalctl --user -u openshell-gateway --no-pager -n 200 || true
          docker ps -a || true

  claude-openshell:
    name: claude ignored tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENSHELL_VERSION: "v0.0.42"
      RIGHT_MAX_CONCURRENT_SANDBOX_TESTS: "1"
      RIGHT_TEST_SANDBOX_READY_TIMEOUT_SECS: "360"
      RIGHT_TEST_SANDBOX_SSH_TIMEOUT_SECS: "120"
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Check Docker runtime
        run: |
          docker version
          docker info

      - name: Install OpenShell
        run: |
          secret="$(openssl rand -hex 32)"
          echo "OPENSHELL_SSH_HANDSHAKE_SECRET=$secret" >> "$GITHUB_ENV"
          systemctl --user set-environment OPENSHELL_SSH_HANDSHAKE_SECRET="$secret"
          curl -LsSf https://raw.githubusercontent.com/NVIDIA/OpenShell/main/install.sh | OPENSHELL_VERSION="$OPENSHELL_VERSION" OPENSHELL_SSH_HANDSHAKE_SECRET="$secret" sh
          openshell --version
          openshell --help

      - name: Wait for OpenShell gateway
        run: |
          for attempt in $(seq 1 90); do
            if openshell status >/dev/null 2>&1 \
              && test -f "$HOME/.config/openshell/gateways/openshell/mtls/ca.crt" \
              && test -f "$HOME/.config/openshell/gateways/openshell/mtls/tls.crt" \
              && test -f "$HOME/.config/openshell/gateways/openshell/mtls/tls.key"; then
              openshell status
              exit 0
            fi
            echo "waiting for OpenShell gateway ($attempt/90)"
            sleep 2
          done
          systemctl --user status openshell-gateway --no-pager || true
          journalctl --user -u openshell-gateway --no-pager -n 80 || true
          exit 1

      - name: OpenShell doctor
        run: openshell doctor check

      - name: Run Claude/OpenShell ignored tests
        run: |
          devenv shell -- bash -lc "export PATH=\"\$PATH:/usr/local/bin:/usr/bin\"; cargo test --workspace --no-fail-fast --locked ci_claude -- --ignored"

      - name: Dump OpenShell diagnostics
        if: failure()
        run: |
          openshell status || true
          journalctl --user -u openshell-gateway --no-pager -n 200 || true
          docker ps -a || true
