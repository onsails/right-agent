name: Tests

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:
  # Daily OpenShell-latest compatibility run. PR/push keep the pinned
  # OPENSHELL_VERSION for reproducible gating; on `schedule` the ignored job
  # resolves the newest OpenShell release instead, so upstream proto/API drift
  # (e.g. the 0.0.56 Sandbox.phase -> SandboxStatus.phase move) surfaces in CI
  # within a day rather than in production.
  schedule:
    - cron: "17 6 * * *"

env:
  CARGO_TERM_COLOR: always

# id-token: write is required for DeterminateSystems/flakehub-cache-action
# (transitively included by onsails/nix-action) to obtain a GitHub Actions
# OIDC token and authenticate against FlakeHub Cache. Without it the cache
# action prints "not authenticated" and falls back to degraded mode.
# contents: read is the standard default — listed explicitly because
# adding any permission narrows the implicit set to what is enumerated.
permissions:
  contents: read
  id-token: write

jobs:
  workspace:
    name: workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      # onsails/nix-action installs Determinate Nix + Devenv + FlakeHub Cache
      # in one step, with impatient-networking defaults (faster CI substituter
      # retries) and parallel substitution. Replaces cachix/install-nix-action
      # + a manual `nix profile add nixpkgs#devenv` step.
      - uses: onsails/nix-action@v2.2.0
      # Free ~25 GB on ubuntu-latest runners (default ~14 GB free, not enough
      # for Nix + Cargo registry + restored target/devenv (~5 GB) + an
      # incremental rebuild on top). Targets are pre-installed tooling we
      # never use here (dotnet, Android SDK, GHC). Without this the cargo
      # build hits ENOSPC partway through.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/.ghcup
          df -h /
      - name: Disk usage before Rust cache
        if: always()
        run: |
          df -h
          du -sh target/devenv ~/.cargo /nix /tmp /home/runner/work 2>/dev/null || true
      # TEMPORARY DIAGNOSTIC (remove after analysis): the rust-cache step below
      # sits silent for ~12 min because its first `devenv shell -- cargo …`
      # call is the first time the devenv environment is realized in the job.
      # This step decomposes that cost: COLD (fresh eval + realize) vs
      # EVAL-ONLY (eval cache dropped, store already realized) vs WARM (both
      # cached). It also surfaces whether realize is download ("copying path")
      # or source build ("building"). Side effect: warms the env so the
      # rust-cache step that follows is fast.
      - name: "DIAG decompose devenv shell cost"
        run: |
          set +e
          nix --version
          echo "::group::COLD devenv shell (fresh eval + realize)"
          t=$SECONDS
          devenv shell -- true > /tmp/cold.log 2>&1
          echo "==> COLD: $((SECONDS - t))s"
          tail -10 /tmp/cold.log
          echo "::endgroup::"
          echo "copying-path lines: $(grep -c 'copying path' /tmp/cold.log)"
          echo "building lines:      $(grep -c 'building' /tmp/cold.log)"
          echo "--- first downloads ---"
          grep 'copying path' /tmp/cold.log | head -8
          echo "--- builds (if any) ---"
          grep 'building' /tmp/cold.log | head -20
          echo "::group::EVAL-ONLY devenv shell (drop eval cache, store warm)"
          rm -f .devenv/nix-eval-cache.db
          t=$SECONDS
          devenv shell -- true > /tmp/eval.log 2>&1
          echo "==> EVAL-ONLY: $((SECONDS - t))s"
          tail -5 /tmp/eval.log
          echo "::endgroup::"
          echo "::group::WARM devenv shell (eval cache + store warm)"
          t=$SECONDS
          devenv shell -- true > /tmp/warm.log 2>&1
          echo "==> WARM: $((SECONDS - t))s"
          echo "::endgroup::"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/devenv"
          cmd-format: devenv shell -- {0}
          # Stable per-job key (drops the auto-appended job suffix) so the
          # cache entry is reused across PRs/pushes for the same lockfile.
          # NOT shared with `ignored` — that job builds with
          # `--features right-openshell/test-support`, so a shared target/
          # would double-build many crates.
          shared-key: "tests-workspace"
      - name: Disk usage after Rust cache
        if: always()
        run: |
          df -h
          du -sh target/devenv ~/.cargo /nix /tmp /home/runner/work 2>/dev/null || true

      - name: Provide external-tool test stubs
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          mkdir -p "$HOME/.cloudflared"
          echo "cloudflared test cert" > "$HOME/.cloudflared/cert.pem"
          cat > "$RUNNER_TEMP/bin/cloudflared" <<'SH'
          #!/bin/sh
          set -eu

          uuid="00000000-0000-0000-0000-000000000000"
          cf_dir="$HOME/.cloudflared"
          mkdir -p "$cf_dir"

          case " $* " in
            *" tunnel "*" list "*)
              printf '[]\n'
              ;;
            *" tunnel "*" create "*)
              for last do :; done
              printf '{}\n' > "$cf_dir/$uuid.json"
              printf '{"id":"%s","name":"%s"}\n' "$uuid" "$last"
              ;;
            *)
              echo "cloudflared test stub" >&2
              ;;
          esac
          SH
          cat > "$RUNNER_TEMP/bin/claude" <<'SH'
          #!/bin/sh
          echo "claude test stub" >&2
          exit 0
          SH
          chmod +x "$RUNNER_TEMP/bin/cloudflared" "$RUNNER_TEMP/bin/claude"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Dashboard bundle freshness
        run: devenv shell -- cargo test -p right-dashboard dashboard_bundle_contains_providers_view

      - name: Test workspace
        run: |
          devenv shell -- bash -lc "export PATH=\"\$RUNNER_TEMP/bin:\$PATH\"; cargo test --workspace --lib --bins --tests --no-fail-fast --locked"

  ignored:
    name: ignored tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Pinned floor for PR/push gating. Must be >= MIN_OPENSHELL_VERSION
      # (crates/right-openshell/src/preflight.rs). The `schedule` run overrides
      # this with the latest release (see "Resolve OpenShell version" below).
      OPENSHELL_VERSION: "v0.0.56"
      OPENSHELL_DRIVERS: "docker"
      RIGHT_TEST_SANDBOX_READY_TIMEOUT_SECS: "360"
      RIGHT_TEST_SANDBOX_SSH_TIMEOUT_SECS: "120"
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      # Same Determinate Nix + Devenv + FlakeHub Cache combo as the workspace
      # job. Replaces cachix/install-nix-action + manual devenv install.
      - uses: onsails/nix-action@v2.2.0
      # Free ~25 GB on ubuntu-latest runners — same rationale as workspace job.
      # The ignored job also installs OpenShell + Docker images later, so disk
      # pressure is even higher here.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/.ghcup
          df -h /
      - name: Disk usage before Rust cache
        if: always()
        run: |
          df -h
          du -sh target/devenv ~/.cargo ~/.right ~/.right/cache/whisper /nix /tmp /home/runner/work 2>/dev/null || true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/devenv"
          cmd-format: devenv shell -- {0}
          # Stable per-job key (drops the auto-appended job suffix) so the
          # cache entry is reused across PRs/pushes for the same lockfile.
          # NOT shared with `workspace` — see that job's shared-key comment.
          shared-key: "tests-ignored"
      - name: Disk usage after Rust cache
        if: always()
        run: |
          df -h
          du -sh target/devenv ~/.cargo ~/.right ~/.right/cache/whisper /nix /tmp /home/runner/work 2>/dev/null || true

      - uses: actions/cache@v5
        with:
          path: ~/.right/cache/whisper
          key: whisper-ggml-tiny-v1
      - name: Disk usage after Whisper cache
        if: always()
        run: |
          df -h
          du -sh target/devenv ~/.cargo ~/.right ~/.right/cache/whisper /nix /tmp /home/runner/work 2>/dev/null || true

      # Warm the cache once, sequentially, on a cache miss. On a cache hit this
      # is a no-op ("already cached"). Without it the three ci_stt tests each
      # download the model concurrently on a cold cache.
      - name: Prefetch whisper model
        run: |
          devenv shell -- cargo run --bin right --locked -- stt preload --model tiny

      - name: Run STT ignored tests
        id: stt_tests
        continue-on-error: true
        run: |
          devenv shell -- cargo test --workspace --lib --bins --tests --no-fail-fast --locked ci_stt -- --ignored
      - name: Disk usage before OpenShell install
        if: always()
        run: |
          df -h
          du -sh target/devenv ~/.cargo ~/.right ~/.right/cache/whisper /nix /tmp /home/runner/work 2>/dev/null || true

      - name: Check Docker runtime
        run: |
          docker version
          docker info

      - name: Resolve OpenShell version (latest on schedule)
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          latest="$(curl -fsSL https://api.github.com/repos/NVIDIA/OpenShell/releases/latest | jq -r '.tag_name')"
          if [ -n "$latest" ] && [ "$latest" != "null" ]; then
            echo "OPENSHELL_VERSION=$latest" >> "$GITHUB_ENV"
            echo "OpenShell-latest compat run: tracking $latest"
          else
            echo "::warning::could not resolve latest OpenShell tag; falling back to pinned $OPENSHELL_VERSION"
          fi

      - name: Install OpenShell
        run: |
          secret="$(openssl rand -hex 32)"
          echo "OPENSHELL_SSH_HANDSHAKE_SECRET=$secret" >> "$GITHUB_ENV"
          systemctl --user set-environment OPENSHELL_SSH_HANDSHAKE_SECRET="$secret"
          systemctl --user set-environment OPENSHELL_DRIVERS="$OPENSHELL_DRIVERS"
          curl -LsSf https://raw.githubusercontent.com/NVIDIA/OpenShell/main/install.sh | OPENSHELL_VERSION="$OPENSHELL_VERSION" OPENSHELL_SSH_HANDSHAKE_SECRET="$secret" sh
          openshell --version
          openshell --help

      - name: Wait for OpenShell gateway
        run: |
          for attempt in $(seq 1 90); do
            if openshell status >/dev/null 2>&1 \
              && test -f "$HOME/.config/openshell/gateways/openshell/mtls/ca.crt" \
              && test -f "$HOME/.config/openshell/gateways/openshell/mtls/tls.crt" \
              && test -f "$HOME/.config/openshell/gateways/openshell/mtls/tls.key"; then
              openshell status
              exit 0
            fi
            echo "waiting for OpenShell gateway ($attempt/90)"
            sleep 2
          done
          systemctl --user status openshell-gateway --no-pager || true
          journalctl --user -u openshell-gateway --no-pager -n 80 || true
          exit 1

      - name: OpenShell doctor
        run: openshell doctor check

      - name: Run Claude/OpenShell ignored tests
        id: claude_tests
        continue-on-error: true
        env:
          RIGHT_MAX_CONCURRENT_SANDBOX_TESTS: "1"
        run: |
          devenv shell -- bash -lc "export PATH=\"\$PATH:/usr/local/bin:/usr/bin\"; cargo test --workspace --lib --bins --tests --no-fail-fast --locked ci_claude -- --ignored"

      - name: Run OpenShell ignored tests
        id: openshell_tests
        continue-on-error: true
        env:
          RIGHT_MAX_CONCURRENT_SANDBOX_TESTS: "2"
        run: |
          devenv shell -- bash -lc "export PATH=\"\$PATH:/usr/local/bin:/usr/bin\"; cargo test --workspace --features right-openshell/test-support --lib --bins --tests --no-fail-fast --locked ci_openshell -- --ignored"

      - name: Dump OpenShell diagnostics
        if: ${{ failure() || steps.claude_tests.outcome == 'failure' || steps.openshell_tests.outcome == 'failure' }}
        run: |
          openshell status || true
          journalctl --user -u openshell-gateway --no-pager -n 200 || true
          docker ps -a || true

      - name: Disk usage summary
        if: always()
        run: |
          df -h
          du -sh target/devenv ~/.cargo ~/.right ~/.right/cache/whisper /nix /tmp /home/runner/work 2>/dev/null || true
          docker system df || true

      - name: Check ignored test results
        if: always()
        run: |
          failed=0
          if test "${{ steps.stt_tests.outcome }}" != "success"; then
            echo "::error::STT ignored tests failed"
            failed=1
          fi
          if test "${{ steps.claude_tests.outcome }}" != "success"; then
            echo "::error::Claude/OpenShell ignored tests failed"
            failed=1
          fi
          if test "${{ steps.openshell_tests.outcome }}" != "success"; then
            echo "::error::OpenShell ignored tests failed"
            failed=1
          fi
          exit "$failed"
