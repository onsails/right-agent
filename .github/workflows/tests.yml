name: Tests

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# id-token: write is required for DeterminateSystems/flakehub-cache-action
# (transitively included by onsails/nix-action) to obtain a GitHub Actions
# OIDC token and authenticate against FlakeHub Cache. Without it the cache
# action prints "not authenticated" and falls back to degraded mode.
# contents: read is the standard default — listed explicitly because
# adding any permission narrows the implicit set to what is enumerated.
permissions:
  contents: read
  id-token: write

jobs:
  workspace:
    name: workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      # onsails/nix-action installs Determinate Nix + Devenv + FlakeHub Cache
      # in one step, with impatient-networking defaults (faster CI substituter
      # retries) and parallel substitution. Replaces cachix/install-nix-action
      # + a manual `nix profile add nixpkgs#devenv` step.
      - uses: onsails/nix-action@v2.2.0
      # Reclaim ~30-40 GB of root-fs space. GitHub hands out two structurally
      # different VM types for ubuntu-latest — a ~145 GB single-disk runner and
      # a ~72 GB runner — so we cannot rely on a fat /mnt being present. We
      # aggressively clear root instead: Nix + Cargo registry + restored
      # target/devenv (~18 GB) + an incremental rebuild on top need it on the
      # smaller VM, where the hand-rolled rm -rf left too little headroom.
      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Disk usage before Rust cache
        if: always()
        run: |
          df -h
          du -sh target/devenv ~/.cargo /nix /tmp /home/runner/work 2>/dev/null || true
      # The ~12 min of silence in the rust-cache step is the FIRST `devenv
      # shell` in the job: fetching the flake inputs (cachix/devenv-nixpkgs
      # rolling tarball + oxalica/rust-overlay) and the first full Nix
      # evaluation. Neither FlakeHub nor magic-nix-cache (store caches) touch
      # this — the cost is the eval layer, which lives in ~/.cache/nix (nix
      # eval cache + fetched flake inputs) and .devenv (devenv's own eval DB +
      # profile). Persist both, keyed on the lockfiles that pin the inputs.
      # NOTE: .devenv here is devenv state, distinct from target/devenv (the
      # cargo target dir cached by Swatinem/rust-cache) — do not conflate.
      - name: Cache devenv eval layer
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/nix
            .devenv
          key: devenv-eval-${{ runner.os }}-${{ hashFiles('devenv.lock', 'devenv.nix', 'devenv.yaml') }}
          restore-keys: |
            devenv-eval-${{ runner.os }}-
      # Warm the devenv environment once so the rust-cache step's first
      # `devenv shell -- cargo …` is not the one paying the realize cost.
      # With the eval cache restored above, the eval + flake-input fetch are
      # skipped; the devenv closure (~4.3 GiB) still substitutes from
      # cache.nixos.org on a fresh runner — an accepted cost (persisting the
      # Nix store would need WarpBuild or exceed the 10 GB GHA cache budget
      # already used by rust-cache).
      - name: Warm devenv shell
        run: devenv shell -- true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/devenv"
          cmd-format: devenv shell -- {0}
          # Stable per-job key (drops the auto-appended job suffix) so the
          # cache entry is reused across PRs/pushes for the same lockfile.
          # NOT shared with `ignored`/`sandbox` — those jobs build different
          # test binaries, so a shared target/ would thrash.
          shared-key: "tests-workspace"
      - name: Disk usage after Rust cache
        if: always()
        run: |
          df -h
          du -sh target/devenv ~/.cargo /nix /tmp /home/runner/work 2>/dev/null || true

      - name: Provide external-tool test stubs
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          mkdir -p "$HOME/.cloudflared"
          echo "cloudflared test cert" > "$HOME/.cloudflared/cert.pem"
          cat > "$RUNNER_TEMP/bin/cloudflared" <<'SH'
          #!/bin/sh
          set -eu

          uuid="00000000-0000-0000-0000-000000000000"
          cf_dir="$HOME/.cloudflared"
          mkdir -p "$cf_dir"

          case " $* " in
            *" tunnel "*" list "*)
              printf '[]\n'
              ;;
            *" tunnel "*" create "*)
              for last do :; done
              printf '{"TunnelID":"%s"}\n' "$uuid" > "$cf_dir/$uuid.json"
              printf '{"id":"%s","name":"%s"}\n' "$uuid" "$last"
              ;;
            *)
              echo "cloudflared test stub" >&2
              ;;
          esac
          SH
          cat > "$RUNNER_TEMP/bin/claude" <<'SH'
          #!/bin/sh
          echo "claude test stub" >&2
          exit 0
          SH
          chmod +x "$RUNNER_TEMP/bin/cloudflared" "$RUNNER_TEMP/bin/claude"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Dashboard bundle freshness
        run: devenv shell -- cargo nextest run -p right-dashboard -E 'test(dashboard_bundle_contains_providers_view)'

      - name: Test workspace
        run: |
          devenv shell -- bash -lc "export PATH=\"\$RUNNER_TEMP/bin:\$PATH\"; cargo nextest run --profile ci --workspace --locked"
      - name: Doctests (guard)
        run: devenv shell -- cargo test --doc --workspace --locked

  ignored:
    name: ignored tests (STT)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      # Same Determinate Nix + Devenv + FlakeHub Cache combo as the workspace
      # job. Replaces cachix/install-nix-action + manual devenv install.
      - uses: onsails/nix-action@v2.2.0
      # Same aggressive root-fs cleanup as the workspace job: the whisper
      # model cache plus a full target/ leave little headroom on the 72 GB
      # runner variant.
      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      # Persist the devenv eval layer (nix eval cache + fetched flake inputs +
      # devenv state) — same rationale as the workspace job. Without it the
      # first devenv shell re-fetches inputs and re-evaluates from scratch on
      # every run (~12 min). Keyed on the lockfiles that pin the inputs.
      - name: Cache devenv eval layer
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/nix
            .devenv
          key: devenv-eval-${{ runner.os }}-${{ hashFiles('devenv.lock', 'devenv.nix', 'devenv.yaml') }}
          restore-keys: |
            devenv-eval-${{ runner.os }}-
      # Warm the devenv environment once (cold on a cache miss, fast on a hit)
      # so the rust-cache step's first `devenv shell -- cargo …` is not the one
      # paying the realize cost.
      - name: Warm devenv shell
        run: devenv shell -- true
      - name: Disk usage before Rust cache
        if: always()
        run: |
          df -h
          du -sh target/devenv ~/.cargo ~/.right ~/.right/cache/whisper /nix /tmp /home/runner/work 2>/dev/null || true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/devenv"
          cmd-format: devenv shell -- {0}
          # Stable per-job key (drops the auto-appended job suffix) so the
          # cache entry is reused across PRs/pushes for the same lockfile.
          # NOT shared with `workspace` — see that job's shared-key comment.
          shared-key: "tests-ignored"
      - name: Disk usage after Rust cache
        if: always()
        run: |
          df -h
          du -sh target/devenv ~/.cargo ~/.right ~/.right/cache/whisper /nix /tmp /home/runner/work 2>/dev/null || true

      - uses: actions/cache@v6
        with:
          path: ~/.right/cache/whisper
          key: whisper-ggml-tiny-v1
      - name: Disk usage after Whisper cache
        if: always()
        run: |
          df -h
          du -sh target/devenv ~/.cargo ~/.right ~/.right/cache/whisper /nix /tmp /home/runner/work 2>/dev/null || true

      # Warm the cache once, sequentially, on a cache miss. On a cache hit this
      # is a no-op ("already cached"). Without it the three ci_stt tests each
      # download the model concurrently on a cold cache.
      - name: Prefetch whisper model
        run: |
          devenv shell -- cargo run --bin right --locked -- stt preload --model tiny

      - name: Run STT ignored tests
        run: |
          devenv shell -- cargo nextest run --profile ci-ignored --workspace --locked --run-ignored=only -E 'test(/ci_stt_/)'

      - name: Disk usage summary
        if: always()
        run: |
          df -h
          du -sh target/devenv ~/.cargo ~/.right ~/.right/cache/whisper /nix /tmp /home/runner/work 2>/dev/null || true

  # Live-microVM lane: `ci_msb_` boots real Agent Sandboxes and `ci_claude_`
  # runs a full Claude Code turn inside one. Both need a runner exposing
  # /dev/kvm; GitHub-hosted ubuntu-latest does not. The job is therefore
  # opt-in through the repository variable SANDBOX_RUNNER — set it to the
  # label of a nested-virtualization runner and the suite runs as-is. Skipping
  # is the honest default: on a hypervisor-less host every one of these tests
  # fails on HypervisorUnavailable, which says nothing about the code.
  sandbox:
    name: live sandbox tests
    if: vars.SANDBOX_RUNNER != ''
    runs-on: ${{ vars.SANDBOX_RUNNER }}
    timeout-minutes: 60
    env:
      # Cap on concurrently live microVMs, read by the test harness's slot
      # gate. Matches the per-prefix groups in .config/nextest.toml.
      RT_MSB_MAX_CONCURRENT_VMS: "2"
      RIGHT_TEST_RUN_ID: "${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: onsails/nix-action@v2.2.0
      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Cache devenv eval layer
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/nix
            .devenv
          key: devenv-eval-${{ runner.os }}-${{ hashFiles('devenv.lock', 'devenv.nix', 'devenv.yaml') }}
          restore-keys: |
            devenv-eval-${{ runner.os }}-
      - name: Warm devenv shell
        run: devenv shell -- true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/devenv"
          cmd-format: devenv shell -- {0}
          shared-key: "tests-sandbox"
      - name: Confirm the host can run microVMs
        run: |
          test -r /dev/kvm || { echo "::error::runner exposes no readable /dev/kvm"; exit 1; }
      # Nothing else to provision: the microsandbox runtime installs itself on
      # first use via right_sandbox::ensure_runtime_installed.
      - name: Run Claude + microVM ignored tests
        run: |
          devenv shell -- cargo nextest run --profile ci-ignored --workspace --locked --run-ignored=only -E 'test(/ci_claude_/) | test(/ci_msb_/)'
      - name: Disk usage summary
        if: always()
        run: |
          df -h
          du -sh target/devenv ~/.cargo ~/.right /nix /tmp 2>/dev/null || true
