# Build the Astro site and deploy it to GitHub Pages.
name: Deploy site to Pages

on:
  push:
    branches: ["master"]
    paths:
      - "site/**"
      - "nix/site/**"
      - "devenv.nix"
      - "devenv.yaml"
      - "devenv.lock"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # Determinate Nix + devenv + FlakeHub cache, matching tests.yml.
      - uses: onsails/nix-action@v2.2.0
      - name: Build site (Bun, in the devenv site profile)
        env:
          # Prefer repository variables; fall back to secrets because this is
          # public browser config and may have been entered there. The host is
          # hardcoded (reverse proxy) in src/components/PostHog.astro.
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY || secrets.PUBLIC_POSTHOG_KEY }}
        run: |
          devenv --profile site shell -- bash -lc \
            'cd site && bun install --frozen-lockfile && bun run build'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
