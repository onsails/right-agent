# cargo-nextest configuration. https://nexte.st/docs/configuration
#
# Concurrency model: test-groups bound concurrency WITHIN one `cargo nextest
# run`. The host-global, cross-worktree cap is still enforced separately by
# acquire_sandbox_slot() via RIGHT_MAX_CONCURRENT_SANDBOX_TESTS. Both apply —
# and the slot cap is the binding TOTAL: the merged CI ignored run sets it to 2,
# so even though the per-prefix groups below sum to 3 (claude 1 + openshell 2),
# at most 2 live sandboxes ever exist at once (matching the pre-merge profile).
# The group caps shape per-prefix parallelism; the slot cap bounds the total.

[profile.default]
# Local dev loop: fail fast, no retries.
fail-fast = true
retries = 0

[profile.ci]
# Workspace job: run everything, absorb the two known parallel-load flakes
# (cc/invocation pid race, dashboard warn-count) with one retry.
fail-fast = false
retries = 1

[profile.ci-ignored]
# Live-sandbox job: run everything; never auto-mask a flaky sandbox test.
fail-fast = false
retries = 0

[test-groups]
sandbox-claude = { max-threads = 1 }
sandbox-openshell = { max-threads = 2 }

# ci_claude_* — heaviest (a full Claude Code turn inside the sandbox): 1 at a time.
# slow-timeout is a HANG backstop, not a tight bound: 300s × 6 = 30min hard kill.
# It must clear the legit worst case — ci_claude_upgrade_lifecycle does sandbox
# boot (READY 360 + SSH 120 in CI) + `claude install` 180 + `claude upgrade` 180
# ≈ 850s — plus headroom for a slot wait, while staying under the 60min job cap.
[[profile.ci-ignored.overrides]]
filter = 'test(/ci_claude_/)'
test-group = 'sandbox-claude'
slow-timeout = { period = '300s', terminate-after = 6 }

# ci_openshell_* — sandbox I/O suite: 2 at a time. Same 30min hang backstop;
# the provider/github integration tests also boot sandboxes + do network I/O.
[[profile.ci-ignored.overrides]]
filter = 'test(/ci_openshell_/)'
test-group = 'sandbox-openshell'
slow-timeout = { period = '300s', terminate-after = 6 }
